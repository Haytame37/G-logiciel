<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dockerized App</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      .container {
        text-align: center;
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }
      h1 {
        color: #333;
        margin: 0 0 20px 0;
      }
      p {
        color: #666;
        font-size: 16px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🐳 Bienvenue dans l'application Dockerisée</h1>
      <p>Cette application est orchestrée avec Docker et Docker Compose</p>
      <p>Services actifs :</p>
      <ul style="text-align: left; display: inline-block">
        <li>Frontend : Nginx (ce serveur)</li>
        <li>Backend : PostgreSQL</li>
        <li>Administration : PgAdmin</li>
      </ul>
    </div>
  </body>
</html>
